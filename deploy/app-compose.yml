# Eterna Ops Command Center - production compose (Oracle box, behind host nginx)
# Deploy: docker compose -f deploy/app-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: eterna-app:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3101"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
